<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="turboRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="fireCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield/Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Turbocharger Volute Spiral Housing -->
  <path d="M46 14 C36 8 20 12 14 22 C8 32 10 46 22 52 C34 58 48 54 52 40 C55 30 50 20 40 18 C30 16 22 22 22 30 C22 38 30 42 36 38"
        stroke="url(#turboRing)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Turbo Snout Outlet -->
  <path d="M40 12 L50 10 L52 18 L43 20 Z" fill="url(#turboRing)"/>

  <!-- Central Impeller / Turbine Core -->
  <circle cx="32" cy="34" r="10" fill="#09090b" stroke="url(#fireCore)" stroke-width="1.5"/>

  <!-- Turbine Blades -->
  <path d="M32 26 C33 30 31 33 32 34 M39 30 C37 32 34 33 32 34 M38 39 C35 38 33 36 32 34 M31 42 C32 39 32 36 32 34 M25 38 C28 37 30 35 32 34 M25 30 C28 31 31 33 32 34"
        stroke="url(#fireCore)" stroke-width="2" stroke-linecap="round"/>

  <!-- Tachometer Gauge Redline Arc -->
  <path d="M44 44 A18 18 0 0 0 49 25" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8"/>

  <!-- Tachometer Speed Needle (Targeting Redline) with Glow -->
  <g filter="url(#glow)">
    <polygon points="32,34 34,32 54,16 52,14 30,32" fill="url(#needleGrad)"/>
    <circle cx="32" cy="34" r="3.5" fill="#fef08a" stroke="#dc2626" stroke-width="1.5"/>
  </g>
</svg>
